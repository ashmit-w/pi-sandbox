# ServiceAccount + namespace-scoped Role granting ONLY what the API needs.
# No cluster-wide permissions, no cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pi-sandbox-api
  namespace: pi-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pi-sandbox-api
  namespace: pi-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pi-sandbox-api
  namespace: pi-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pi-sandbox-api
subjects:
  - kind: ServiceAccount
    name: pi-sandbox-api
    namespace: pi-sandbox
